<text x="88" y="827" fill="#d8b858" font-family="Arial,sans-serif" font-size="15" font-weight="700">MÉTRICA</text>
<text x="448" y="827" fill="#d8b858" font-family="Arial,sans-serif" font-size="15" font-weight="700">BASELINE</text>
<text x="690" y="827" fill="#d8b858" font-family="Arial,sans-serif" font-size="15" font-weight="700">SINGLE-PASS</text>
<text x="936" y="827" fill="#d8b858" font-family="Arial,sans-serif" font-size="15" font-weight="700">CAMBIO</text>
<text x="88" y="864" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">Coste comunicado</text><text x="448" y="864" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">US$0,029742</text><text x="690" y="864" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">US$0,035898</text><text x="936" y="864" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">+20,7 %</text>
<text x="88" y="894" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">p95 total</text><text x="448" y="894" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">863 ms</text><text x="690" y="894" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">950 ms</text><text x="936" y="894" fill="#fffefa" font-family="Arial,sans-serif" font-size="16">+10,1 %</text>
<text x="58" y="955" fill="#617078" font-family="Arial,sans-serif" font-size="14">Misma cohorte; control baseline enviado explícitamente. Los otros motores no tienen clasificación de semilla equivalente en este banco.</text>
