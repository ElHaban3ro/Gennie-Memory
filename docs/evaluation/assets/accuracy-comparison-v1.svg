<text x="1060" text-anchor="end" y="191" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1a7f74">6/6 · 100.0%</text>
<rect x="595" y="201" width="465" height="22" rx="11" fill="#e8edf3"/>
<rect x="595" y="201" width="465.0" height="22" rx="11" fill="#1a7f74"/>
<text x="595" y="279" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#17233b">Engram MCP</text>
<text x="1060" text-anchor="end" y="279" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#64748b">5/6 · 83.3%</text>
<rect x="595" y="289" width="465" height="22" rx="11" fill="#e8edf3"/>
