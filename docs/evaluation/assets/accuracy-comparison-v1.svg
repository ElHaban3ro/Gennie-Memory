<text x="1017" y="547" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#20252b">Engram MCP</text>
<line x1="80" y1="604" x2="1140" y2="604" stroke="#d9dedb" stroke-width="1"/>
<text x="80" y="633" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#187d7b">LECTURA</text>
<text x="171" y="633" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20252b">Engram encuentra 2 recuerdos más; la semilla logra 1 respuesta más en seis casos.</text>
<text x="80" y="668" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#657078">El eje izquierdo empieza en 450 para revelar 2 casos de diferencia; el derecho empieza en 0. Muestras distintas.</text>
