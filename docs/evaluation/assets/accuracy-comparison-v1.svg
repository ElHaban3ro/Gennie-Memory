<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">¿Cuántas preguntas acierta cada ruta?</title>
<desc id="desc">La recuperación de candidatos usa un eje ampliado de 450 a 460 aciertos: iROMEM 452 y Engram 454 sobre 460 positivas. La respuesta final usa un eje desde cero: Codex con semilla inicial simulada acierta seis de seis y Codex con Engram cinco de seis. No se equiparan las dos pruebas.</desc>
