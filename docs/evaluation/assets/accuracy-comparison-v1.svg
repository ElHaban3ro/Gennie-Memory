<text x="64" y="49" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#187d7b">iROMEM  /  FIGURA 02</text>
<text x="64" y="95" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#20252b">¿Cuántas preguntas acierta cada ruta?</text>
<text x="64" y="133" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#657078">Dos pruebas distintas: encontrar el recuerdo y responder con él.</text>
