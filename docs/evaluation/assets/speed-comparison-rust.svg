<text x="58" y="586" fill="#617078" text-anchor="start" font-family="Arial,sans-serif" font-size="16">El panel 3 mide a Codex con semilla ya entregada; la integración automática de iROMEM sigue pendiente.</text>
<text x="58" y="612" fill="#617078" text-anchor="start" font-family="Arial,sans-serif" font-size="16">Las etapas tienen escalas distintas. Las barras parten de cero; las muestras de 540 y 6 no estiman la misma tasa.</text>
