[workspace]
members = ["kernel", "apps/retrieval", "apps/dashboard", "bootstrap", "tools/evaluation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
h2 = "=0.4.20"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dotenvy = "=0.15.7"
sha2 = "=0.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { version = "=0.8.9", features = ["json"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
gennie-memory-kernel = { path = "kernel" }
gennie-memory-retrieval = { path = "apps/retrieval" }
gennie-memory-dashboard = { path = "apps/dashboard" }
