[workspace]
members = ["kernel", "apps/retrieval", "bootstrap"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dotenvy = "=0.15.7"
sha2 = "=0.11.0"
iromem-kernel = { path = "kernel" }
iromem-retrieval = { path = "apps/retrieval" }
