[workspace]
members = ["kernel", "apps/retrieval", "bootstrap", "tools/evaluation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
tiktoken-rs = { version = "=0.12.0", default-features = false }
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
h2 = "=0.4.20"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
dotenvy = "=0.15.7"
sha2 = "=0.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "=1.53.1", features = ["rt", "net"] }
gennie-memory-kernel = { path = "kernel" }
gennie-memory-retrieval = { path = "apps/retrieval" }
